name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild at 08:05 Bogotá so posts with a future pubDate go live on their date.
    - cron: "5 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  pages:
    uses: ./.github/workflows/pages.yml
